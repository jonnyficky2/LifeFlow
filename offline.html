<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - LifeFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
        color: #f8fafc;
      }
      .page {
        padding: 24px;
        max-width: 520px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 2rem;
      }
      p {
        margin: 8px 0;
        line-height: 1.6;
      }
      .action {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Tidak Terhubung</h1>
      <p>Maaf, aplikasi sedang offline atau tidak dapat memuat halaman ini saat ini.</p>
      <p>Silakan periksa koneksi internet Anda, lalu muat ulang halaman.</p>
      <a class="action" href="./">Muat Ulang</a>
    </div>
  </body>
</html>
